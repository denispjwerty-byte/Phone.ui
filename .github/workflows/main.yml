name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p project
          unzip -oq LiquidGlassLauncher-debug.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "Project dir: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build
        run: gradle assembleDebug -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"
        working-directory: ${{ env.PROJ }}
      - uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassLauncher-debug
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/*.apk
